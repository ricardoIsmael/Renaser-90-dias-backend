services:
  db:
    image: pgvector/pgvector:pg16
    container_name: renaser-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: renaser
    ports:
      - "5433:5432"
    volumes:
      - renaser_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d renaser"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: renaser-redis
    restart: unless-stopped
    environment:
      # Si REDIS_PASSWORD esta definido en .env, el mismo valor lo toma la app desde
      # application.yaml y este contenedor arranca con requirepass. Vacio conserva el modo local
      # sin autenticacion para no obligar a cada checkout a tener un secreto.
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --requirepass "$$REDIS_PASSWORD"
        else
          exec redis-server
        fi
    ports:
      - "6379:6379"
    volumes:
      - renaser_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping; else redis-cli ping; fi"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Voz del orbe (renaser.ia.voz.proveedor=piper, IA_VOZ_URL=http://localhost:5055). Opcional:
  # sin este servicio el backend responde 204 y la app habla con el TTS del telefono.
  # Detras del perfil `voz` para que `docker compose up` siga levantando solo db y redis (la
  # imagen baja ~100 MB de modelo al construirse): `docker compose --profile voz up -d piper`.
  piper:
    profiles: ["voz"]
    build: ./infra/piper
    container_name: renaser-piper
    restart: unless-stopped
    ports:
      - "5055:5055"

  # Observabilidad LOCAL (D-237): Prometheus + Grafana con los paneles de infra/observabilidad.
  # Detras del perfil para que `docker compose up` siga levantando solo db y redis:
  #   docker compose --profile observabilidad up -d
  # Grafana en http://localhost:3000 (admin/admin, solo local); Prometheus en http://localhost:9090.
  # Scrapean al backend que corre en el HOST, en su puerto de administracion 8091 (actuator.yaml).
  # En produccion no va esto: va Grafana Alloy hacia Grafana Cloud (infra/observabilidad/alloy).
  prometheus:
    profiles: ["observabilidad"]
    image: prom/prometheus:v3.15.0
    container_name: renaser-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
      # Para probar en local la config de Alloy de produccion: que mande aca en vez de a Grafana Cloud.
      - --web.enable-remote-write-receiver
    # En Linux `host.docker.internal` no existe salvo que se declare: host-gateway es la IP del host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"
    volumes:
      - ./infra/observabilidad/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - renaser_prometheus_data:/prometheus

  grafana:
    profiles: ["observabilidad"]
    image: grafana/grafana:13.2.3
    container_name: renaser-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/renaser-general.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./infra/observabilidad/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observabilidad/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - renaser_grafana_data:/var/lib/grafana

volumes:
  renaser_db_data:
  renaser_redis_data:
  renaser_prometheus_data:
  renaser_grafana_data:
