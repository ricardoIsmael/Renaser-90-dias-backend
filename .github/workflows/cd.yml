# Entrega continua: construye la imagen de Docker, la sube a Amazon ECR y la despliega.
#
# QUE HACE: construir y publicar la imagen (etiquetada con el SHA del commit y con `latest`), y
# despues reemplazar el contenedor `backend` de la instancia EC2 por esa imagen, esperando a que
# `/actuator/health` responda UP antes de dar el despliegue por bueno. Si la instancia tiene memoria
# para dos JVM, lo hace SIN CORTE (nginx delante y dos contenedores un rato); si no, con el corte de
# ~50 s de siempre. Lo decide `scripts/despliegue/desplegar-backend.sh` (E-465, D-235).
#
# COMO DESPLIEGA: por AWS Systems Manager (`ssm send-command` + `AWS-RunShellScript`). No hay ECS,
# ni CodeDeploy, ni balanceador: es una sola instancia EC2 corriendo dos contenedores de Docker
# (`redis` y `backend`) en la red `renaser`. Para ese caso SSM es el mecanismo correcto — no hace
# falta abrir SSH, ni guardar una clave privada como secret, ni tener la instancia en una subred
# publica alcanzable por el runner. El detalle esta en docs/DESPLIEGUE_Y_CI.md §5.3.
#
# SE DESPLIEGA LA ETIQUETA DEL COMMIT, NO `latest`. `latest` no dice que version esta corriendo ni
# permite saber a cual volver; la del SHA si, y ademas es inmutable en la practica.
#
# AUTENTICACION: OIDC contra AWS, sin claves de acceso guardadas como secrets. GitHub le da al job
# un token de identidad de corta duracion y AWS lo cambia por credenciales temporales para un rol.
# El rol y su politica de confianza estan documentados en docs/DESPLIEGUE_Y_CI.md §5.
name: CD

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  # `id-token: write` es lo que habilita OIDC. Sin este permiso, configure-aws-credentials no
  # puede pedir el token y falla con "Could not load credentials from any providers".
  id-token: write
  contents: read

jobs:
  # EL GATE. Sin esto, un push a master disparaba CI y CD en paralelo: el CD construye la imagen
  # con `-DskipTests` (ver el comentario del Dockerfile) y con cache de capas, asi que terminaba
  # y desplegaba a produccion antes de que el CI llegara a saber si la suite pasaba. Un CI rojo
  # no frenaba nada: la imagen ya estaba publicada y el contenedor de la EC2 ya reemplazado.
  #
  # Hoy eso no se notaba porque el CD se saltea entero mientras falten las variables de AWS. El
  # agujero se abria SOLO el dia que alguien las cargara, sin tocar una linea de codigo.
  #
  # Se invoca el CI como job propio (`workflow_call`) en vez de usar `workflow_run` porque
  # `workflow_run` cambia el significado de `github.sha`: las etiquetas de la imagen, el checkout
  # y el comentario del comando SSM apuntan al commit, y habria que corregir los cuatro lugares
  # sin equivocarse. Asi el SHA sigue siendo el del push que disparo el despliegue.
  pruebas:
    name: Suite completa antes de desplegar
    uses: ./.github/workflows/ci.yml
    # Explicito y minimo: el CI no necesita el `id-token: write` que este workflow declara arriba
    # para OIDC, y no hay motivo para prestarle la llave de AWS a un job que solo compila y prueba.
    permissions:
      contents: read

  publicar-imagen:
    name: Construir y publicar en ECR
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Sin CI verde no se publica. Si la suite falla o se cancela, este job no arranca y el de
    # despliegue tampoco, porque depende de este.
    needs: pruebas

    # Lo que el job de despliegue necesita saber: si hubo publicacion, y que imagen exacta se
    # publico. La referencia viaja completa (registro + repositorio + SHA) para que el job de
    # abajo no tenga que rearmarla y arriesgarse a que las dos versiones se desincronicen.
    outputs:
      configurado: ${{ steps.aws.outputs.configurado }}
      imagen: ${{ steps.etiquetas.outputs.sha }}
      registro: ${{ steps.ecr.outputs.registry }}

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v7

      # Mismo criterio que el workflow de SonarCloud: mientras la infraestructura de AWS no
      # exista, este workflow avisa y termina en verde en vez de pintar de rojo cada push a
      # master. En cuanto las variables del repositorio esten cargadas, corre solo.
      - name: Ver si la infraestructura de AWS esta configurada
        id: aws
        shell: bash
        env:
          ROL: ${{ vars.AWS_ROLE_ARN }}
          REGION: ${{ vars.AWS_REGION }}
          REPO_ECR: ${{ vars.ECR_REPOSITORY }}
        run: |
          # Con `if` explicitos y no con `[ ... ] && VAR=...`: bajo `set -e` (que es como
          # GitHub invoca `shell: bash`) esa forma abreviada corta el paso si resulta ser la
          # ultima linea del script. Funciona hasta que alguien agrega o quita una linea.
          FALTAN=""
          if [ -z "$ROL" ];      then FALTAN="$FALTAN AWS_ROLE_ARN";   fi
          if [ -z "$REGION" ];   then FALTAN="$FALTAN AWS_REGION";     fi
          if [ -z "$REPO_ECR" ]; then FALTAN="$FALTAN ECR_REPOSITORY"; fi
          if [ -n "$FALTAN" ]; then
            echo "configurado=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Faltan variables del repositorio:$FALTAN. Se saltea la publicacion."
            {
              echo "### Publicacion en ECR: salteada"
              echo ""
              echo "Faltan estas variables de repositorio:\`$FALTAN\`."
              echo "Como crearlas: \`docs/DESPLIEGUE_Y_CI.md\` §5."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configurado=true" >> "$GITHUB_OUTPUT"
          fi

      # Solo hace falta para construir para una arquitectura distinta a la del runner. Con
      # IMAGEN_PLATAFORMAS=linux/amd64 (el default) no se usa, pero instalarlo cuesta segundos.
      - name: Preparar QEMU (compilacion cruzada)
        if: steps.aws.outputs.configurado == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Preparar Buildx
        if: steps.aws.outputs.configurado == 'true'
        uses: docker/setup-buildx-action@v4

      # Aca ocurre el intercambio OIDC: no hay AWS_ACCESS_KEY_ID ni AWS_SECRET_ACCESS_KEY en
      # ningun lado. Las credenciales que salen de este paso duran lo que dura el job.
      - name: Autenticarse en AWS por OIDC
        if: steps.aws.outputs.configurado == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-renaser-backend-${{ github.run_id }}

      - name: Iniciar sesion en ECR
        if: steps.aws.outputs.configurado == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Armar las etiquetas de la imagen
        if: steps.aws.outputs.configurado == 'true'
        id: etiquetas
        shell: bash
        env:
          REGISTRO: ${{ steps.ecr.outputs.registry }}
          REPO_ECR: ${{ vars.ECR_REPOSITORY }}
        run: |
          # Dos etiquetas, y las dos hacen falta:
          #  - el SHA completo identifica sin ambiguedad que commit corre en produccion y permite
          #    volver a una version anterior sin reconstruir nada;
          #  - `latest` es la que apunta el despliegue cuando no se pide una version concreta.
          #    Nunca sirve para saber QUE esta corriendo: para eso esta la del SHA.
          echo "lista=${REGISTRO}/${REPO_ECR}:${GITHUB_SHA},${REGISTRO}/${REPO_ECR}:latest" >> "$GITHUB_OUTPUT"
          echo "sha=${REGISTRO}/${REPO_ECR}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Construir y publicar
        if: steps.aws.outputs.configurado == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.etiquetas.outputs.lista }}
          # Default `linux/amd64` porque es la arquitectura del runner y compila nativo. Para
          # Graviton hay que poner `linux/arm64` en la variable de repositorio IMAGEN_PLATAFORMAS.
          #
          # AVISO DE COSTO: cruzar a arm64 con QEMU emula la etapa de Maven entera y puede pasar
          # de 4 minutos a mas de 30. Si el destino termina siendo Graviton, conviene mover este
          # job a un runner arm64 nativo (`runs-on: ubuntu-24.04-arm`) en vez de emular.
          platforms: ${{ vars.IMAGEN_PLATAFORMAS || 'linux/amd64' }}
          # Cache de capas entre corridas, guardada en la propia cache de GitHub Actions.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Resumen
        if: steps.aws.outputs.configurado == 'true'
        shell: bash
        run: |
          {
            echo "### Imagen publicada"
            echo ""
            echo '```'
            echo "${{ steps.etiquetas.outputs.sha }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  desplegar:
    name: Desplegar en la instancia EC2 (por SSM)
    needs: publicar-imagen
    # Si no se publico nada (faltaban variables), no hay nada nuevo que desplegar.
    if: needs.publicar-imagen.outputs.configurado == 'true'
    runs-on: ubuntu-latest
    # Tope duro del job. El presupuesto fino lo lleva el paso de espera; esto es la red de
    # seguridad para que un runner colgado no quede una hora ocupando un puesto de la cola.
    timeout-minutes: 25

    steps:
      - name: Ver si hay una instancia destino configurada
        id: destino
        shell: bash
        env:
          INSTANCIA: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          if [ -z "$INSTANCIA" ]; then
            echo "configurado=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Falta la variable de repositorio EC2_INSTANCE_ID. La imagen quedo publicada en ECR pero NO se desplego."
            {
              echo "### Despliegue: salteado"
              echo ""
              echo "Falta la variable de repositorio \`EC2_INSTANCE_ID\`."
              echo "Como crearla: \`docs/DESPLIEGUE_Y_CI.md\` §5.3."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configurado=true" >> "$GITHUB_OUTPUT"
          fi

      # Solo para leer `scripts/despliegue/desplegar-backend.sh`, que es lo que corre en la instancia.
      - name: Descargar el codigo
        if: steps.destino.outputs.configurado == 'true'
        uses: actions/checkout@v7

      - name: Autenticarse en AWS por OIDC
        if: steps.destino.outputs.configurado == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-despliegue-${{ github.run_id }}

      # El script que corre DENTRO de la instancia se escribe a un archivo y se codifica con `jq`
      # antes de mandarlo. NO se arma inline dentro de `--parameters commands=[...]`.
      #
      # POR QUE (esto costo dos fallos reales, ver BITACORA_ERRORES.md E-140): en esa forma inline
      # la cadena atraviesa el shell del runner, el parser de la CLI y el del documento de SSM. Las
      # comillas simples se pierden, y un `$` termina expandido antes de llegar a la instancia —
      # `$$` es el caso peor, porque el shell lo reemplaza por su propio PID y el comando *funciona*
      # con un valor equivocado. `jq -Rs` toma el archivo entero como una unica cadena JSON, asi que
      # lo que corre en la instancia es byte por byte lo que dice el heredoc.
      - name: Armar el script de despliegue
        if: steps.destino.outputs.configurado == 'true'
        shell: bash
        env:
          IMAGEN: ${{ needs.publicar-imagen.outputs.imagen }}
          REGISTRO: ${{ needs.publicar-imagen.outputs.registro }}
          REGION: ${{ vars.AWS_REGION }}
          # Arrancar la aplicacion lleva unos 40 s (Spring Boot + Flyway contra RDS). El tope se
          # deja MUY por encima para que un arranque lento por una migracion larga o por una RDS
          # fria no se confunda con un despliegue roto. Se puede subir con una variable de
          # repositorio sin tocar este archivo.
          ESPERA: ${{ vars.DESPLIEGUE_ESPERA_SEGUNDOS || '240' }}
          # `auto` (default): sin corte si la memoria alcanza para dos JVM. `reemplazo` fuerza el
          # modo con corte: hace falta cuando una migracion rompe al codigo que esta corriendo
          # (borrar o renombrar una columna que la version vieja usa), porque en el modo sin corte
          # la version vieja sigue atendiendo ~50 s contra el esquema ya migrado. Ver E-465.
          MODO: ${{ vars.DESPLIEGUE_MODO || 'auto' }}
        run: |
          set -euo pipefail

          # El cuerpo es `scripts/despliegue/desplegar-backend.sh`, un archivo propio y no un heredoc
          # aca adentro, para poder probarlo en local con Docker (ver su cabecera y E-465). Decide
          # solo entre el modo SIN CORTE (proxy + dos contenedores) y el REEMPLAZO de siempre,
          # mirando la memoria disponible de la instancia: en la t3.small de hoy hace lo mismo que
          # antes, porque ahi dos JVM no entran (E-155).

          # Los valores se inyectan como asignaciones al principio del script, no interpolados
          # adentro del cuerpo: asi el cuerpo queda literal y auditable de un vistazo.
          {
            printf "IMAGEN='%s'\n"   "$IMAGEN"
            printf "REGISTRO='%s'\n" "$REGISTRO"
            printf "REGION='%s'\n"   "$REGION"
            printf "ESPERA='%s'\n"   "$ESPERA"
            printf "MODO='%s'\n"     "$MODO"
            # D-237: la config de Grafana Alloy viaja dentro del script (base64: sin comillas ni
            # `$` que el shell remoto pueda interpretar). El script solo la usa si ademas hay
            # credenciales de Grafana Cloud en Parameter Store; si no, no hace nada.
            printf "CONFIG_ALLOY_B64='%s'\n" "$(base64 -w0 infra/observabilidad/alloy/config.alloy)"
            cat scripts/despliegue/desplegar-backend.sh
          } > desplegar.sh

          jq -Rs '{commands: [.]}' desplegar.sh > parametros.json
          echo "Script de ${ESPERA}s de tope armado ($(wc -l < desplegar.sh) lineas)."

      - name: Ejecutarlo en la instancia y esperar el resultado
        if: steps.destino.outputs.configurado == 'true'
        shell: bash
        env:
          INSTANCIA: ${{ vars.EC2_INSTANCE_ID }}
          REGION: ${{ vars.AWS_REGION }}
          ESPERA: ${{ vars.DESPLIEGUE_ESPERA_SEGUNDOS || '240' }}
        run: |
          set -euo pipefail

          CID=$(aws ssm send-command \
            --region "$REGION" \
            --instance-ids "$INSTANCIA" \
            --document-name AWS-RunShellScript \
            --comment "CD ${GITHUB_SHA:0:7}" \
            --parameters file://parametros.json \
            --query "Command.CommandId" --output text)
          echo "CommandId=$CID"
          echo "CID=$CID" >> "$GITHUB_ENV"

          # `ssm send-command` es asincrono: devuelve un id y se va. El codigo de salida del script
          # remoto NO llega por ahi — llega en el Status de la invocacion. Sin este bucle, el
          # workflow quedaria verde aunque la aplicacion no hubiera arrancado nunca.
          #
          # `aws ssm wait command-executed` existe, pero su tope es de 100 s: menos que el arranque
          # de la aplicacion. Por eso el bucle es propio.
          LIMITE=$(( ESPERA + 600 ))
          INICIO=$SECONDS
          ESTADO=Pending
          while true; do
            ESTADO=$(aws ssm get-command-invocation --region "$REGION" \
                       --command-id "$CID" --instance-id "$INSTANCIA" \
                       --query "Status" --output text 2>/dev/null || echo Pending)
            case "$ESTADO" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            if [ $(( SECONDS - INICIO )) -ge "$LIMITE" ]; then
              ESTADO=SinRespuesta
              break
            fi
            sleep 5
          done

          echo "----- salida de la instancia -----"
          aws ssm get-command-invocation --region "$REGION" \
            --command-id "$CID" --instance-id "$INSTANCIA" \
            --query "StandardOutputContent" --output text 2>/dev/null || true
          ERR=$(aws ssm get-command-invocation --region "$REGION" \
                  --command-id "$CID" --instance-id "$INSTANCIA" \
                  --query "StandardErrorContent" --output text 2>/dev/null || true)
          # Ojo con leer esto como "fallo": `docker login` escribe siempre en stderr un aviso de
          # que guarda la credencial sin cifrar en /root/.docker/config.json. Es benigno y
          # esperable. Quien decide si el despliegue salio bien es el Status de la invocacion,
          # nunca el hecho de que stderr traiga texto.
          if [ -n "$ERR" ] && [ "$ERR" != "None" ]; then
            echo "----- stderr de la instancia (puede traer avisos benignos) -----"
            echo "$ERR"
          fi
          echo "----------------------------------"

          echo "ESTADO_SSM=$ESTADO" >> "$GITHUB_ENV"
          if [ "$ESTADO" != "Success" ]; then
            echo "::error::El despliegue fallo (estado SSM: $ESTADO). La instancia NO quedo sirviendo esta version."
            exit 1
          fi
          echo "Despliegue verificado: /actuator/health respondio UP."

      - name: Resumen
        if: always() && steps.destino.outputs.configurado == 'true'
        shell: bash
        env:
          IMAGEN: ${{ needs.publicar-imagen.outputs.imagen }}
          INSTANCIA: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          {
            echo "### Despliegue: ${ESTADO_SSM:-sin resultado}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Imagen | \`$IMAGEN\` |"
            echo "| Instancia | \`$INSTANCIA\` |"
            echo "| Comando SSM | \`${CID:-no llego a enviarse}\` |"
            echo ""
            echo "Si la salida dice \`Modo: reemplazo\`, la API dejo de responder unos 50 s; con"
            echo "\`Modo: sin-corte\`, no. Ver \`docs/DESPLIEGUE_Y_CI.md\` §5.3 y E-465."
          } >> "$GITHUB_STEP_SUMMARY"
