# Integracion continua: compila y corre la suite completa en cada push y cada PR.
#
# Corre sobre ubuntu-latest porque las pruebas de integracion usan Testcontainers y necesitan un
# demonio de Docker; los runners de Ubuntu de GitHub lo traen instalado y andando. Un runner de
# Windows o macOS NO sirve para esto.
name: CI

on:
  push:
    # `master` queda FUERA a proposito (2026-09-15): desde que el CD llama a este mismo workflow
    # como primer job, un push a master ya corre la suite adentro del CD. Sin esta exclusion
    # correria dos veces, 45 minutos cada una, para verificar exactamente lo mismo. Las PR hacia
    # master si la corren (evento `pull_request`, abajo), que es donde el resultado sirve para
    # bloquear el merge.
    branches-ignore: [master]
  pull_request:
  workflow_dispatch:
  # Permite que otro workflow lo invoque como job propio. Lo usa `cd.yml` para no poder desplegar
  # sin CI verde: antes los dos se disparaban en paralelo con el mismo push a master, y como el
  # CD construye con `-DskipTests`, terminaba y desplegaba ANTES de que el CI supiera si las
  # pruebas pasaban. Si el CI se ponia rojo, la imagen ya estaba en ECR y el contenedor ya habia
  # sido reemplazado.
  workflow_call:

# Si se empuja dos veces seguidas a la misma rama, cancela la corrida vieja: la suite tarda
# varios minutos y no tiene sentido pagar dos veces por un commit que ya quedo atras.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Guarda contra el fallo de E-111: `mvnw` puede terminar en exit 0 SIN correr una sola prueba
  # (por ejemplo con JAVA_HOME mal), y cualquier automatismo que mire solo el codigo de salida da
  # el commit por probado. El paso "Verificar que las pruebas realmente corrieron" suma las lineas
  # `Tests run:` de la salida y falla si el total queda por debajo de este piso.
  #
  # NO es una meta de cobertura ni un candado contra borrar pruebas: es un canario contra el cero.
  # Se fija bien por debajo del total real para que agrupar o eliminar pruebas legitimamente no
  # rompa el CI, pero muy por encima de cero para que "no corrio nada" no pase desapercibido.
  MINIMO_PRUEBAS: 2000

jobs:
  build:
    name: Compilar y probar
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v7

      - name: Instalar JDK 25 (Temurin)
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          # Cachea ~/.m2/repository usando pom.xml como clave. Sin esto cada corrida vuelve a
          # bajar Spring Boot, Spring AI, el SDK de AWS y Testcontainers desde cero.
          cache: 'maven'

      - name: Mostrar el entorno
        run: |
          java -version
          ./mvnw -version
          docker --version

      # El mismo camino que se corre en local antes de decir «terminado»:
      # `scripts/verificar.sh` corre `./mvnw -B -ntp clean verify` (`verify` y no `test`: es lo unico que corre TAMBIEN
      # las pruebas de integracion *IT.java y genera el XML de JaCoCo), deja la salida en salida-maven.log y aplica la
      # guarda de E-111 (docs/BITACORA_ERRORES.md): suma las lineas de RESUMEN `Tests run:` de surefire y failsafe y falla
      # si no aparece ninguna o si el total queda por debajo de MINIMO_PRUEBAS. Con `--ci` no corre las reglas de código ni la
      # trazabilidad: esos tienen su workflow (trazabilidad.yml), que termina en segundos. Si cambia lo que se verifica,
      # cambia en el script, no aca.
      - name: Compilar, correr la suite completa y verificar que las pruebas corrieron
        shell: bash
        run: bash scripts/verificar.sh --ci

      - name: Publicar el reporte de cobertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          # El HTML es para mirarlo a mano; el XML es el que consume SonarCloud; el .exec es el
          # dato crudo, por si hay que regenerar el reporte sin volver a correr la suite.
          path: |
            target/site/jacoco/
            target/jacoco.exec
          if-no-files-found: warn
          retention-days: 14

      # Sin esto, un fallo de prueba en CI obliga a leer 4000 lineas de log en el navegador.
      - name: Publicar los informes de las pruebas que fallaron
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: informes-de-pruebas
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            salida-maven.log
          if-no-files-found: warn
          retention-days: 14
