# Trazabilidad de specs: cada requisito (FR-NNN) y cada criterio de exito (SC-NNN) de las specs exigidas tiene que
# tener, por lo menos, una prueba que lo cubra. Lo comprueba `scripts/trazabilidad-specs.mjs`; la convencion y la
# lista de specs exigidas (`specs/trazabilidad.json`) estan en `.claude/rules/06-trazabilidad-de-specs.md`.
#
# Workflow aparte de `ci.yml` a proposito: no compila ni corre las pruebas (eso tarda ~45 minutos), solo lee texto
# (las specs y las marcas `spec NNN FR-NNN` de las pruebas), asi que termina en segundos y avisa de un requisito
# sin prueba sin esperar al resto.
#
# LAS PRUEBAS DE LA APP viven en otro repositorio (Jest y flujos de Maestro del frontend). Es PUBLICO, asi que se
# baja sin token ni secreto. En un PR se busca primero la rama de la app que se llama IGUAL que la rama del PR (una
# spec que toca los dos repos se trabaja en ramas del mismo nombre, p. ej. `041-recordatorios-impl`): asi el PR del
# backend se revisa contra las pruebas de la app que van con el. Si esa rama no existe (o no es un PR), `master`.
# Por eso, al fusionar, el PR de la app va ANTES que el del backend: en `master` el job lee el `master` de la app.
# (Hasta el 05/11/2026 se leia primero `integracion-formaciones`; esa rama ya se fusiono en el `master` de la app
# (#92) y quedo vieja: no trae las marcas de las specs 040 en adelante.)
#
# Sale con 1 si un requisito exigido no tiene prueba o si una marca apunta a un requisito que la spec no define; con 2
# si la configuracion esta mal (una spec de la lista sin carpeta). El resumen en tablas queda en la pagina del job.
#
# Las acciones van fijadas por SHA de commit, con la version en un comentario (Dependabot las actualiza y respeta ese formato).
name: Trazabilidad de specs

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: trazabilidad-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trazabilidad:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Backend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Historia completa: el chequeo de migraciones compara contra origin/master (que no se edite una aplicada).
          fetch-depth: 0

      # El repositorio de la app es publico: sin `token`, sin PAT. Si la app no tiene una rama con el nombre de la del
      # PR, el paso falla (continue-on-error) y el siguiente baja `master`. Fuera de un PR (`head_ref` vacio) no corre.
      - name: App (rama con el mismo nombre que la del PR)
        id: app_rama
        if: github.head_ref != ''
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: RENASER-LAB/Renaser-90-dias-frontend-
          ref: ${{ github.head_ref }}
          path: app
          persist-credentials: false

      - name: App (master, si no hay rama con el mismo nombre)
        if: steps.app_rama.outcome != 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: RENASER-LAB/Renaser-90-dias-frontend-
          ref: master
          path: app
          persist-credentials: false

      # Node ya viene en el runner (el script pide Node 18 o mas y no tiene dependencias).
      # Incluye el despliegue automatico de la Lambda de miniaturas (workflow, politica del rol y script del duenio): un workflow
      # de AWS no se puede correr sin empujar, y esta es la unica red que lo revisa antes de fusionar.
      - name: Pruebas del propio script, reglas de código y despliegue de la Lambda
        run: node --test scripts/trazabilidad-specs.test.mjs scripts/reglas-de-codigo.test.mjs scripts/lambda-miniaturas-ci.test.mjs

      - name: Trazabilidad de las specs exigidas
        run: node scripts/trazabilidad-specs.mjs app --md "$GITHUB_STEP_SUMMARY"
