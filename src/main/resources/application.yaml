spring:
  # Hace que un .env en la raiz del repo se lea de verdad. Sin esto, Spring Boot NO lee
  # archivos .env (a diferencia de Node o Expo), asi que poner la clave ahi no hace nada y
  # el sintoma es un 401 del proveedor que parece de credencial invalida y en realidad es
  # de credencial vacia. `optional:` deja arrancar sin el archivo, que es el caso de CI.
  config:
    import: optional:file:.env[.properties]
  application:
    name: renaser-backend
  # AWS Systems Manager Parameter Store: APAGADO por defecto, encendido solo en el perfil
  # `prod` (application-prod.yaml). Ver el comentario del starter en pom.xml para el detalle.
  #
  # La propiedad tiene que estar PRESENTE y en false; no alcanza con no ponerla.
  # `ParameterStoreAutoConfiguration` es @ConditionalOnProperty(matchIfMissing = true), asi que
  # con la clave ausente se activa, declara un bean `SsmClient` y su construccion resuelve la
  # region con DefaultAwsRegionProviderChain. Sin region eso lanza `SdkClientException: Unable
  # to load region from any of the providers in the chain` en el arranque — o sea, la app deja
  # de levantar sin credenciales de AWS, que es justo la propiedad de este repo que hay que
  # conservar (todos los adaptadores externos tienen NoOp y `optional:file:.env` no exige nada).
  #
  # El mismo bloque esta espejado en src/test/resources/application.yaml, que REEMPLAZA a este
  # archivo en el classpath de test en vez de complementarlo.
  cloud:
    aws:
      parameterstore:
        enabled: ${AWS_PARAMETER_STORE_ENABLED:false}
      region:
        static: ${AWS_REGION:us-east-1}
  threads:
    virtual:
      enabled: true
  # Timeout de las respuestas ASINCRONAS de MVC, que es lo que usa el chat del asistente
  # (`Flux<String>` por SSE en RenasiaController). Sin esto rige el default del contenedor —
  # Tomcat corta un request async a los 30 s — y una respuesta larga con herramientas se
  # partia a mitad sin ningun error del lado del servidor: el cliente veia el stream cerrarse
  # sin `fin`. Se deja por encima del timeout HTTP del cliente de Google (60 s, en
  # GoogleGenAiClientesConfig) con margen para dos llamadas de herramienta seguidas, que son
  # dos viajes al modelo. (auditoria NFR 2026-09-06)
  mvc:
    async:
      request-timeout: ${MVC_ASYNC_REQUEST_TIMEOUT:120s}
  # C-1 (docs/informes/auditoria-seguridad-concurrencia-2026-09-01.html): con hilos
  # virtuales habilitados, Spring Boot usa un SimpleAsyncTaskExecutor sin tope propio para
  # @Async — sin `simple.concurrency-limit`, cada despacho (hoy solo onboarding, la
  # validacion V90) lanza un hilo mas sin ningun limite. 20 concurrentes duplica el
  # escenario de la auditoria ("diez aprendices piden validacion en el mismo minuto") y
  # acota cuanto se llama a Gemini/el proveedor de IA a la vez (protege su rate limit,
  # no solo el pool de Postgres, que ya no lo necesita porque la IA dejo de correr dentro
  # de una transaccion). Se deja `reject-tasks-when-limit-reached` en su default (false):
  # al llegar al tope, el despacho espera un permiso en vez de fallar — no retiene ninguna
  # conexion de base mientras espera, asi que esperar es mas barato que romper el flujo.
  task:
    execution:
      simple:
        concurrency-limit: ${ASYNC_IA_CONCURRENCY_LIMIT:20}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/renaser}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    # C-1: HikariCP no tenia ningun valor propio (el default sin configurar es 10,
    # "pool Hikari de 10" que cito la auditoria). Ahora que la IA ya no retiene conexiones
    # (ver los @Service de onboarding/rag/academy), el pool solo necesita cubrir
    # transacciones cortas (CLAUDE.MD §3: unos pocos ms cada una) — 20 da margen frente a
    # los mismos 20 despachos concurrentes de arriba sin sobre-provisionar un Postgres
    # unico en Docker local (§11, todavia sin entorno productivo definido).
    # connection-timeout mas corto que el default de Hikari (30000ms): si el pool esta
    # agotado de verdad (ej. caida de Postgres), una request ya viola por 100x el SLO de
    # §3 mucho antes de los 30s — falla rapido (5s) en vez de amontonar requests esperando.
    hikari:
      pool-name: RenaserHikari
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:5000}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # En local quedan vacios para el redis:7-alpine del compose; en prod llegan desde
      # Parameter Store. El username solo hace falta si Redis usa ACL y ssl.enabled solo si el
      # proveedor expone TLS.
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      # Auditoria NFR 2026-09-06 (2a pasada). Sin esto rige el default de Lettuce: 60 s por
      # comando. Desde que casi toda la API exige sesion (que vive en Redis), un Redis caido
      # dejaba CADA request colgado un minuto antes de fallar — incluido /actuator/health, que es
      # lo que mira el CD para decidir si el despliegue salio bien. Redis corre en la misma
      # maquina y responde en menos de un milisegundo: 3 s es generoso, 60 s es una caida total.
      timeout: ${REDIS_TIMEOUT:3s}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
  # SMTP. Spring Boot solo crea el bean JavaMailSender si `spring.mail.host` tiene valor
  # (docs.spring.io/spring-boot/reference/io/email.html); sin credenciales queda vacio y el
  # perfil se sostiene con NoOpEnviarEmailAdapter. Los timeouts son obligatorios: sin ellos, un
  # servidor SMTP que no responde bloquea el hilo de la request hasta el timeout del SO.
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
  session:
    timeout: 30d
    data:
      redis:
        repository-type: indexed
        # Namespace nuevo para no intentar leer sesiones antiguas serializadas con JDK. El
        # cambio invalida las sesiones existentes y obliga a iniciar sesion una vez.
        namespace: ${REDIS_SESSION_NAMESPACE:renaser:session:v2}
  # C-18 (docs/informes/auditoria-seguridad-concurrencia-2026-09-01.html,
  # docs/informes/auditoria-fixes/C-18.md): open-in-view estaba activo por default (sin esta
  # clave) y mantenia la sesion de Hibernate abierta durante todo el renderizado de la
  # respuesta HTTP -- una transaccion de facto sin limite claro, contraria al patron de
  # transaccion corta de CLAUDE.MD S3. Se apaga porque en este repo el riesgo clasico
  # (LazyInitializationException al armar el DTO fuera del servicio) no aplica: verificado
  # que ninguna de las 74 *JpaEntity de src/main/java tiene @OneToMany/@ManyToOne/@OneToOne/
  # @ManyToMany reales (cero resultados de grep, ni @Basic(fetch=LAZY) ni @Lob), los dos
  # unicos @ElementCollection (InformeEspejoSombraJpaEntity, RocaSemanalJpaEntity) son
  # FetchType.EAGER, y ninguna *JpaEntity se referencia fuera de su propio paquete
  # adapter/out/persistence (regla hexagonal de CLAUDE.MD S5.1: solo domain/DTOs cruzan hacia
  # el controller). Detalle completo del analisis en C-18.md.
  jpa:
    open-in-view: false
  ai:
    model:
      chat: none
      embedding: none
      vectorstore: none
  ai.google.genai.api-key: ${GOOGLE_GENAI_API_KEY:}
  # Modelo de embeddings (D-51 quedo obsoleta): text-embedding-004 fue retirado por Google
  # el 2026-01-14, asi que el default anterior apuntaba a un modelo inexistente y la primera
  # indexacion con credenciales reales habria fallado. gemini-embedding-001 devuelve 3072
  # dimensiones por defecto y hay que truncarlo a 768 para que calce con la columna
  # vector(768) de base_conocimiento — es truncado nativo del modelo (Matryoshka), no un
  # recorte casero, y 768 es una de las medidas que Google recomienda.
  #
  # OJO: los vectores de dos modelos distintos no son comparables aunque midan igual. Todo
  # lo que se indexe con este modelo hay que reindexarlo si algun dia se cambia.
  ai.google.genai.embedding.text.model: ${RENASIA_EMBEDDING_MODEL:gemini-embedding-001}
  ai.google.genai.embedding.text.dimensions: ${RENASIA_EMBEDDING_DIMENSIONS:768}
  # Limitacion conocida: el tipo de tarea es uno solo para todo, pero indexar un documento y
  # buscar una pregunta necesitan tipos distintos. Arreglarlo pide que EmbeddingPort lleve el
  # dato; mientras tanto la recuperacion es peor de lo que podria ser.
  ai.google.genai.embedding.text.task-type: ${RENASIA_EMBEDDING_TASK_TYPE:RETRIEVAL_DOCUMENT}
  # Modelo de chat: nadie lo habia elegido. gemini-3.1-flash-lite es el mas barato de la serie
  # vigente y su precio no es promocional. La serie 2.5 quedo en fin de vida (retiro anunciado
  # para octubre de 2026), asi que no se usa. Para el Espejo de la Sombra conviene subir a
  # gemini-3.8-flash, que corre una vez por semana y produce el texto mas delicado.
  #
  # Corregido 2026-09-24 (E-233): el default era gemini-3.1-flash-lite. Ese dia Google lo tenia
  # sobrecargado ("503 This model is currently experiencing high demand") y respondia en 2-8 s; el
  # orbe mostraba "El asistente esta saturado". Medido con la misma key, 3 llamadas por modelo:
  # 3.5-flash-lite 1,2-3,0 s y sin fallas; 3.1-flash-lite 2,2-3,8 s con 503 a ratos; 3.7/3.8-flash
  # 4-9 s con 503. 3.5-flash-lite llama bien a las herramientas del acompanante. Ojo al pasar a
  # produccion: produccion no fija RENASIA_CHAT_MODEL, asi que toma este default; revisar su precio.
  ai.google.genai.chat.model: ${RENASIA_CHAT_MODEL:gemini-3.5-flash-lite}
  # C-7: el outbox de Spring Modulith (event_publication, V2) no tenia ninguna configuracion
  # propia. Analisis completo en docs/informes/auditoria-fixes/C-7.md.
  modulith:
    events:
      # Si el proceso muere entre el commit del evento y que el listener termine, la fila queda
      # incompleta y nadie la reentregaba. Con esto se reentrega al arrancar. El riesgo de
      # avalancha al reiniciar queda acotado por el mismo tope de C-1
      # (spring.task.execution.simple.concurrency-limit), que gobierna el executor que Modulith
      # reutiliza para @ApplicationModuleListener.
      republish-outstanding-events-on-restart: true
      # UPDATE (el default) marca completion_date y deja la fila para siempre: crecimiento sin
      # limite (E-4). DELETE la borra apenas se completa, asi que en el camino feliz no queda
      # nada que purgar. La purga de EventPublicationMaintenanceScheduler queda como red de
      # seguridad por si algun entorno vuelve a UPDATE.
      completion-mode: DELETE
  autoconfigure:
    exclude:
      - org.springframework.ai.model.google.genai.autoconfigure.chat.GoogleGenAiChatAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingConnectionAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiTextEmbeddingAutoConfiguration
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration

renaser:
  security:
    # Paso 3 de DL-08 (SDD 002, rol Lider de Mentores). En false, MENTOR_LEAD pasa por
    # PermissionEnforcementInterceptor en MODO SOMBRA: se evalua su matriz de permisos y se
    # REGISTRA en el log lo que se habria denegado, pero la request sigue. En true, deniega de
    # verdad. Arranca apagado a proposito: hasta el 2026-09-09 este rol no pasaba por ninguna
    # verificacion, y encender el cumplimiento de golpe convierte en 403 cualquier endpoint que
    # use y que falte en su matriz -- incluidos los de su propio programa de 90 dias. Se pone en
    # true recien cuando el log del modo sombra este limpio en uso real; volver atras es cambiar
    # esta linea, no desplegar codigo.
    mentor-lead-enforcement: ${MENTOR_LEAD_ENFORCEMENT:false}
  notifications:
    web-push:
      # La publica va al bundle web; la privada queda solo en el backend. Ambas se generan una
      # vez y se conservan estables para que las suscripciones no se invaliden.
      vapid-public-key: ${WEB_PUSH_VAPID_PUBLIC_KEY:}
      vapid-private-key: ${WEB_PUSH_VAPID_PRIVATE_KEY:}
      vapid-subject: ${WEB_PUSH_VAPID_SUBJECT:mailto:soporte@renaser.com}
  # Ventanas de lock de los schedulers que NO son seguros con varias instancias (C-5) mas
  # los que se agregaron despues con el mismo criterio (habits-generar-tracks-del-dia).
  # lock-at-most-for: si el proceso muere sin soltar el lock, este es el tiempo que el barrido
  # queda bloqueado -- tiene que superar lo que tarda la corrida mas lenta, o dos instancias se
  # solapan igual. lock-at-least-for: evita que dos instancias con relojes desfasados por
  # milisegundos entren las dos. Justificacion de cada valor en docs/informes/auditoria-fixes/C-5.md
  # EventPublicationMaintenanceScheduler (shared/infrastructure/event), C-7.
  eventos:
    # Cada cuanto reintenta publicaciones incompletas SIN esperar a un restart: el backend
    # corre siempre-arriba y entre un deploy y el siguiente pueden pasar dias. El umbral es
    # mayor a cualquier ejecucion normal de un listener (hoy solo escrituras a Postgres) para
    # no reintentar algo que esta lento en vez de fallado.
    reintento-tras: PT5M
    mantenimiento-cron: "0 */5 * * * *"
    # Red de seguridad si algun entorno vuelve a completion-mode=UPDATE; con DELETE esta purga
    # normalmente no encuentra nada.
    retencion-completados: P7D
  scheduling:
    shedlock:
      evidence-procesar-cola:
        lock-at-most-for: PT20M
        lock-at-least-for: PT10S
      habits-promover-cambios-horario:
        lock-at-most-for: PT15M
        lock-at-least-for: PT10S
      rag-generar-informes-semanales:
        lock-at-most-for: PT6H
        lock-at-least-for: PT1M
      # D-67: avanza el dia de programa de cada participante. Sin lock, dos instancias
      # pueden avanzar al mismo aprendiz dos veces y hacerle saltar un dia del programa.
      users-avanzar-dia-programa:
        lock-at-most-for: PT30M
        lock-at-least-for: PT30S
      # Barrido nocturno que genera los tracks del dia (habits-barrido-nocturno.md). Sin
      # lock, dos instancias recorren el padron completo y duplican el trabajo por
      # participante (el UNIQUE de registros_habito evita filas duplicadas, pero no evita
      # el trabajo doble ni, el dia que haya IA en el camino, el costo doble).
      habits-generar-tracks-del-dia:
        lock-at-most-for: PT30M
        lock-at-least-for: PT30S
      # Avisos automaticos de habitos (barrido cada 5 min). Sin lock, dos instancias recorren
      # el padron completo y hacen el trabajo doble; lo que NO pueden es duplicar el aviso, eso
      # ya lo impide la deduplicacion de notificaciones por origen_evento_id (C-7/V16).
      # lock-at-most-for por debajo del intervalo del cron a proposito: si el proceso muere sin
      # soltar el lock, se pierde a lo sumo una corrida, no la tarde entera.
      habits-despachar-avisos:
        lock-at-most-for: PT4M
        lock-at-least-for: PT10S
      # D-168: barrido horario del semaforo del aprendiz (minuto 25). Sin lock, dos instancias
      # calculan el padron dos veces; la foto semanal no se duplica (PK + ON CONFLICT DO NOTHING)
      # ni el aviso (solo lo publica quien inserto la foto), pero es trabajo doble.
      points-cerrar-semaforo:
        lock-at-most-for: PT20M
        lock-at-least-for: PT30S
      # Resumen semanal del semaforo para mentores y lider/admin (D-168, cada hora en el minuto
      # 40; solo actua el sabado de 00:00 a 05:59 en la zona de cada grupo). Sin lock, dos
      # instancias recorren los grupos y publican el mismo resumen dos veces; la notificacion
      # doble ya la impide la deduplicacion por origen_evento_id (C-7/V16), el trabajo doble no.
      # lock-at-most-for muy por debajo de la hora a proposito: si el proceso muere con el lock
      # tomado, la corrida siguiente de la ventana no se pierde.
      mentoring-resumir-semana-semaforo:
        lock-at-most-for: PT20M
        lock-at-least-for: PT30S
  habits:
    # Cuanto antes se avisa cada cosa (2026-09-05). NO son constantes en el codigo porque el
    # dueno todavia no confirmo los numeros y este repo tiene una regla explicita contra
    # rellenar reglas de negocio con supuestos: estos dos valores son PROVISORIOS y estan a la
    # espera de confirmacion. Ver AvisosHabitoConfig para el detalle.
    #
    # antelacion-vencimiento se mide contra el PLAZO de entrega (hora limite + gracia +
    # extension), no contra la hora limite: desde D-97 entregar dentro de la extension paga el
    # puntaje completo, asi que la hora limite ya no es el momento en que se pierde algo.
    #
    # Poner cualquiera de los dos en PT0S apaga ese aviso, sin ninguna bandera aparte.
    avisos:
      antelacion-inicio: ${HABITS_AVISO_ANTELACION_INICIO:PT15M}
      antelacion-vencimiento: ${HABITS_AVISO_ANTELACION_VENCIMIENTO:PT30M}
  # Que proveedor de IA se usa. `noop` (el default) mantiene los adaptadores vacios: la app
  # arranca sin credenciales y responde con placeholders, que es una propiedad valiosa de este
  # repo y conviene no perder. `google` los reemplaza por los adaptadores reales de Gemini.
  #
  # Mismo mecanismo que ya usan renaser.email.proveedor y renaser.storage.proveedor; no se
  # invento uno nuevo. Sin esto, agregar un adaptador real tumbaba el arranque por ambiguedad:
  # dos beans para el mismo puerto y ninguna condicion que los separe.
  #
  # OJO: ponerlo en google antes de que existan los adaptadores reales deja puertos sin
  # implementacion y el arranque falla. Falla fuerte y claro, que es lo correcto, pero conviene
  # saberlo antes de tocarlo.
  #
  # Solo gobierna los puertos que HOY tienen dos implementaciones: el chat de Renasia y los
  # embeddings. Un puerto con una sola implementacion no lleva interruptor — apagarle el unico
  # adaptador que tiene deja el arranque sin bean y la app no levanta.
  #
  # Sin interruptor, entonces: el insight semanal del Espejo y la recomendacion de clase (todavia
  # no tienen adaptador real), y las validaciones de evidencia y V90, que salieron del alcance
  # (D-76) y cuyo comportamiento vacio ya no es un placeholder sino la conducta definitiva.
  #
  # CUANDO SE AGREGUE un adaptador real para el Espejo o para la recomendacion, hay que ponerle
  # la condicion a su NoOp en el mismo commit. Si no, quedan dos beans para el mismo puerto y el
  # arranque falla por ambiguedad.
  ia:
    proveedor: ${IA_PROVEEDOR:noop}
    # Grounding con Google Search dentro de Renasia (2026-09-04, pedido del dueño): con esto en
    # true el modelo puede buscar en internet cuando la base de conocimiento del programa no
    # cubre la pregunta, en vez de abstenerse. El prompt de sistema le exige decir de que fuente
    # sale cada respuesta, asi que "busca" nunca se confunde con "es contenido del programa".
    #
    # Solo tiene efecto con proveedor=google; el adaptador noop ni lo lee. Se deja en true por
    # defecto a proposito — es el comportamiento pedido — y se apaga con IA_BUSQUEDA_WEB=false
    # si hace falta acotar costo o volver a encerrar al asistente en el material propio.
    #
    # OJO: cada respuesta que use la herramienta de busqueda se cobra distinto que una respuesta
    # normal. Verificado contra el bytecode de spring-ai-google-genai:2.0.0 —
    # GoogleGenAiChatOptions.Builder.googleSearchRetrieval(Boolean) termina en
    # Tool.builder().googleSearch(GoogleSearch.builder().build()), no es una opcion muerta.
    #
    # D-100 (2026-09-04): el default paso a FALSE. Con `gemini-3.1-flash-lite` (el modelo por
    # defecto de arriba) la peticion con la herramienta de busqueda es rechazada por la API, el
    # stream muere y el aprendiz veia sus preguntas sin ninguna respuesta. Para encender la
    # busqueda hay que usar un modelo que la soporte (RENASIA_CHAT_MODEL sin `-lite`) Y poner
    # IA_BUSQUEDA_WEB=true — las dos cosas, en la configuracion de ejecucion.
    busqueda-web: ${IA_BUSQUEDA_WEB:false}
    # Voz del orbe (/api/v1/renasia/voz): texto -> WAV con Gemini o Piper (voz es_MX-claude-high,
    # que corre como servicio aparte (infra/piper/, servicio `piper` de docker-compose.yml)).
    # `noop` (el default) no tiene voz: el endpoint responde 204 y la app habla con el TTS del
    # telefono. `piper` usa el servicio en `url`; `google`, la voz Kore de Gemini (bloque `gemini`).
    # Un valor distinto de noop/piper/google hace fallar el arranque con un mensaje claro (E-228).
    # Interruptor propio, separado de renaser.ia.proveedor: la voz se prende o apaga sin tocar el
    # chat.
    #
    # Si Piper tarda mas que timeout-ms, esta caido o no devuelve un WAV, tambien es 204: la app
    # nunca se queda muda por culpa del servicio de voz.
    #
    # Corregido 2026-09-23 (D-159): se sumo `google` (voz Kore, elegida por el dueno escuchando
    # muestras), con la MISMA key que el chat (spring.ai.google.genai.api-key). Transmite el audio
    # mientras se genera: ~1,5 s al primer sonido. Costo de flash-lite TTS: US$0,50 por millon de
    # tokens de texto y US$6 por millon de tokens de audio (~25 por segundo) hasta 2026-12-31; se
    # duplica desde 2027-01-01. Una respuesta hablada de 10 s cuesta ~US$0,0015.
    voz:
      proveedor: ${IA_VOZ_PROVEEDOR:noop}
      gemini:
        url: ${IA_VOZ_GEMINI_URL:https://generativelanguage.googleapis.com}
        modelo: ${IA_VOZ_GEMINI_MODELO:gemini-3.8-flash-lite-tts}
        voz: ${IA_VOZ_GEMINI_VOZ:Kore}
        # Como hablar. Es lo que la hace sonar fluida y no leida; se afina sin tocar codigo.
        estilo: ${IA_VOZ_GEMINI_ESTILO:Habla de forma fluida y natural, como en una conversacion relajada con un amigo. Ritmo continuo, entonacion viva, sin pausas roboticas entre frases. Espanol latinoamericano neutro.}
        # Lo maximo que se espera a que Gemini empiece a responder.
        timeout-ms: ${IA_VOZ_GEMINI_TIMEOUT_MS:15000}
      url: ${IA_VOZ_URL:http://localhost:5055}
      # Conexion y lectura, cada una. Una oracion tarda ~280 ms en la laptop de desarrollo.
      timeout-ms: ${IA_VOZ_TIMEOUT_MS:5000}
      # Parametros de Piper, afinados para una voz menos robotica: un poco mas lenta
      # (length-scale > 1) y con mas variacion de entonacion (noise-scale) y de ritmo
      # (noise-w-scale). Se cambian por entorno, sin tocar codigo.
      length-scale: ${IA_VOZ_LENGTH_SCALE:1.06}
      noise-scale: ${IA_VOZ_NOISE_SCALE:0.78}
      noise-w-scale: ${IA_VOZ_NOISE_W_SCALE:0.95}
      # Conversacion por voz en tiempo real con Gemini Live (D-162,
      # docs/arquitectura/PROPUESTA_GEMINI_LIVE.md): WebSocket /api/v1/renasia/voz/en-vivo. El
      # backend hace de intermediario: la key no sale del servidor, las herramientas corren con el
      # actor de la sesion y la transcripcion se guarda en mensajes_renasia (el audio nunca).
      #
      # Apagada por defecto. Con `activa: false` el socket igual existe y responde `error` +
      # cierre 1013 `no-disponible`, y la app usa el flujo anterior (STT del telefono, chat y voz
      # Kore). Prendida y SIN GOOGLE_GENAI_API_KEY, el backend no arranca y dice por que.
      #
      # Es `en-vivo.activa` y no `en-vivo: true` como decia la propuesta: una clave de YAML no puede
      # ser a la vez un valor y un bloque con modelo/voz/cuota adentro.
      en-vivo:
        activa: ${IA_VOZ_EN_VIVO:false}
        # Sin la key: va en el header x-goog-api-key, nunca en la URL (no queda en ningun log).
        url: ${IA_VOZ_EN_VIVO_URL:wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent}
        modelo: ${IA_VOZ_EN_VIVO_MODELO:gemini-3.8-live}
        voz: ${IA_VOZ_EN_VIVO_VOZ:Kore}
        # Conectar y que Gemini acepte la sesion (setupComplete). Medido: ~3,8 s.
        timeout-ms: ${IA_VOZ_EN_VIVO_TIMEOUT_MS:15000}
        # Decision del dueno (2026-09-24): 10 minutos por persona y por dia, contados en el dia
        # local de la persona. Pasado el limite, `cuotaAgotada` y la app vuelve al flujo anterior.
        # Corregido 2026-09-24: eran 10 (decision del dueno, D-162 §8). Pasan a 30 mientras se prueba
        # con el equipo, a pedido del dueno; antes de produccion se vuelve a decidir (cada minuto
        # de conversacion cuesta ~US$0,014 de entrada mas la salida).
        minutos-por-dia: ${IA_VOZ_EN_VIVO_MINUTOS_POR_DIA:30}
        # Tope de Gemini Live para una sesion de solo audio. Con la cuota de 10 no se alcanza.
        minutos-maximos-por-sesion: ${IA_VOZ_EN_VIVO_MINUTOS_POR_SESION:15}
    acompanante:
      # Fase 2 de la propuesta del acompanante (D-153): con esto en true, `marcar_habito_completado`
      # ya NO marca el habito. Deja una propuesta pendiente y la persona la confirma con un boton
      # en la app; el modelo nunca llega a escribir (lo que evita otro D-132, un "Hola" que cerro
      # un habito).
      #
      # FALSE por defecto, y se prende JUNTO con la version de la app que dibuja los botones del
      # evento `propuesta`, nunca antes. La app no se actualiza por aire: con el flag prendido y
      # una app vieja, la persona ve la propuesta como texto pero no tiene como confirmarla, y
      # marcar desde el chat deja de funcionar para ella.
      #
      # Con false el comportamiento es exactamente el de antes: la herramienta marca en el acto,
      # con la misma descripcion y los mismos mensajes.
      confirmacion-con-botones: ${IA_ACOMPANANTE_CONFIRMACION_CON_BOTONES:false}
      # Cuanto vive una propuesta pendiente antes de que su boton "Confirmar" deje de servir
      # (PropuestasAgenteService). Es una ventana TECNICA de seguridad, no una regla de negocio:
      # evita que una propuesta vieja —armada con los datos de hace horas— se ejecute cuando la
      # persona vuelve al chat y toca un boton que quedo en pantalla. Entre proponer y confirmar
      # las guardas de negocio se vuelven a correr igual. El vencimiento se DERIVA de `vence_en`
      # (no hay scheduler ni estado VENCIDA). Formato ISO-8601 (PT10M) o el corto de Spring (10m).
      propuesta-vigencia: ${IA_ACOMPANANTE_PROPUESTA_VIGENCIA:PT10M}
      # Fase 5 de la propuesta del acompanante (§5.1, "el acompanante escribe primero"): cuando
      # sale un aviso automatico de habito (renaser.habits.avisos), ademas del push queda un
      # mensaje del acompanante en su chat, armado con plantilla y datos reales. SIN llamar a la
      # IA: costo cero y no puede inventar horas ni puntos. No consume la cuota de Renasia.
      # AvisoHabitoEnChatService tiene el detalle (idempotencia, avisos tardios, D-132).
      #
      # FALSE por defecto: que avisos pasan y con que texto quedaron "por decidir" en §5.1.
      avisos-en-chat: ${IA_ACOMPANANTE_AVISOS_EN_CHAT:false}
      # Cuales de los dos avisos pasan al chat: INICIO (esta por empezar) y/o POR_VENCER (se
      # vence el plazo de entrega). Separados por coma. Un nombre que no sea ninguno de esos se
      # ignora.
      avisos-en-chat-tipos: ${IA_ACOMPANANTE_AVISOS_EN_CHAT_TIPOS:INICIO,POR_VENCER}
      # TEXTOS PROVISORIOS: el dueno NO aprobo esta redaccion todavia. Son copia de producto a
      # confirmar, no una decision tomada. Marcadores: {habito}, {hora} (HH:mm en la zona del
      # aprendiz), {puntos} (lo que gana si lo entrega ahora, calculado por habits, D-97) y
      # {minutos}. Una plantilla vacia apaga ese tipo. Sin ${...:default} a proposito: las llaves
      # de los marcadores dentro de un default de Spring son fragiles; se sobreescriben por
      # entorno igual (RENASER_IA_ACOMPANANTE_AVISOSENCHATPLANTILLAINICIO, etc.).
      avisos-en-chat-plantilla-inicio: "Tu hábito {habito} empieza a las {hora}. Hay {puntos} puntos en juego."
      avisos-en-chat-plantilla-por-vencer: "Se te vence {habito} a las {hora}. Si lo haces ahora sumas {puntos} puntos."
      # El acompanante celebra los logros en el chat (LogroEnChatService): mismo molde que
      # avisos-en-chat — plantilla, SIN IA, sin cuota, un solo mensaje por logro aunque el outbox
      # reentregue, y nunca detras de un mensaje de la persona sin respuesta (D-132). El push de
      # notifications sale igual, prendido o apagado esto.
      #
      # FALSE por defecto: que se celebra y con que texto esta por decidir con el dueno.
      logros-en-chat: ${IA_ACOMPANANTE_LOGROS_EN_CHAT:false}
      # Cuales logros pasan al chat, separados por coma: RACHA_SIN_CELULAR (ciclo de 24h del Dia
      # sin celular) y/o ROCA_COMPLETADA (una Roca Diaria con evidencia). Un nombre desconocido se
      # ignora. PROVISORIO: ROCA_COMPLETADA queda afuera por defecto porque se completan varias por
      # dia y celebrar cada una en el chat seria ruido; se agrega aca si el dueno lo quiere.
      logros-en-chat-tipos: ${IA_ACOMPANANTE_LOGROS_EN_CHAT_TIPOS:RACHA_SIN_CELULAR}
      # TEXTOS PROVISORIOS: el dueno NO aprobo esta redaccion todavia. Tono "cercano y calido",
      # tuteo, espanol neutro de Peru. Sin marcadores (los eventos de logro solo traen ids). Una
      # plantilla vacia apaga ese logro. Se sobreescriben por entorno
      # (RENASER_IA_ACOMPANANTE_LOGROSENCHATPLANTILLARACHASINCELULAR, etc.).
      logros-en-chat-plantilla-racha-sin-celular: "¡Lo lograste! Completaste tu día sin celular: 24 horas enteras. Eso es constancia de verdad. ¿Cómo te sentiste?"
      logros-en-chat-plantilla-roca-completada: "¡Roca completada! Un paso firme más hacia lo que te propusiste. Bien hecho."
      # Memoria del acompanante (D-167, V67): lo que aprende de cada persona (contexto de vida, metas
      # y lo que le funciona, como prefiere el trato; nunca lo emocional ni la salud) entra al prompt
      # del chat y de la voz en vivo, y cada ~10 idas y vueltas se resume la conversacion en segundo
      # plano con el modelo de texto. La persona lo ve y lo borra en su perfil.
      #
      # FALSE por defecto: apagada, el prompt queda byte por byte como antes y no se compacta nada.
      # Lo que ya estaba guardado se sigue viendo en el perfil, para poder borrarlo.
      memoria: ${IA_ACOMPANANTE_MEMORIA:false}
      # El acompanante cuenta en el chat como cerro la semana del semaforo (D-168,
      # SemaforoEnChatService): mismo molde que logros-en-chat — plantilla, SIN IA, sin cuota, un
      # solo mensaje por persona y semana aunque el outbox reentregue, y nunca detras de un mensaje
      # de la persona sin respuesta (D-132). El push de notifications ("Tu semana ya cerro", sin
      # cifras) sale igual, prendido o apagado esto.
      #
      # TRUE por defecto desde el 2026-09-25: el dueno pidio avisos automaticos segun el caso, sin
      # esperar aprobacion de textos. (Antes: FALSE hasta que aprobara la redaccion, como D-155.)
      semaforo-en-chat: ${IA_ACOMPANANTE_SEMAFORO_EN_CHAT:true}
      # UN TEXTO POR CASO (los cuatro colores de la semana): se usan tal cual. Tuteo,
      # espanol neutro de Peru. Marcadores: {etiqueta} (la palabra del color que manda points: "Al
      # dia", "Requiere atencion", "Con problemas") y {porcentaje} (el de la semana, con punto
      # decimal como la tarjeta de la app: "86" o "78.3"). La de sin datos se usa tambien cuando
      # la semana no trae porcentaje, y NUNCA lleva numero. Una plantilla vacia apaga ese color. Se
      # sobreescriben por entorno (RENASER_IA_ACOMPANANTE_SEMAFOROENCHATPLANTILLAVERDE, etc.).
      semaforo-en-chat-plantilla-verde: "Cerraste la semana en verde, {etiqueta}: {porcentaje} %. ¡Bien hecho! Tu constancia se nota."
      semaforo-en-chat-plantilla-amarillo: "Cerraste la semana en amarillo, {etiqueta}: {porcentaje} %. Estás cerca: elige un hábito y cuídalo cada día de esta semana."
      semaforo-en-chat-plantilla-rojo: "Cerraste la semana en rojo, {etiqueta}: {porcentaje} %. No es un juicio, es un punto de partida. ¿Empezamos hoy con un paso pequeño? Aquí estoy para acompañarte."
      semaforo-en-chat-plantilla-sin-datos: "Tu semana cerró sin datos en el semáforo. ¿Planificamos juntos esta semana? Elegir hoy tus hábitos y objetivos te ayuda a empezar con claridad."
  email:
    proveedor: ${EMAIL_PROVEEDOR:noop}
    remitente: ${EMAIL_REMITENTE:Renaser <no-reply@TODO-dominio-no-definido.renaser.dev>}
  storage:
    proveedor: ${STORAGE_PROVEEDOR:noop}
    s3:
      bucket: ${AWS_S3_BUCKET:s3-renaser90dias}
      region: ${AWS_REGION:us-east-1}
  auth:
    apple:
      auth-key-path: ${APPLE_AUTH_KEY_PATH:}
      key-id: ${APPLE_KEY_ID:}
      team-id: ${APPLE_TEAM_ID:}
      client-id: ${APPLE_CLIENT_ID:}
    facebook:
      app-id: ${FACEBOOK_APP_ID:}
      app-secret: ${FACEBOOK_APP_SECRET:}
    google:
      client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
      client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
  web:
    cors:
      origenes: ${CORS_ORIGENES:http://localhost:8081,http://localhost:19006,http://localhost:3000}
    reset-password-url: ${RESET_PASSWORD_URL:https://TODO-frontend-no-definido.renaser.dev/reset-password}
    activate-account-url: ${ACTIVATE_ACCOUNT_URL:https://TODO-frontend-no-definido.renaser.dev/activate-account}
  renasia:
    limite-diario: ${RENASIA_LIMITE_DIARIO:25}
    apoyo:
      # El texto que se le muestra a la persona cuando repite expresiones de malestar al escribirle
      # al asistente (2026-09-15): el ofrecimiento de la linea de salud mental del MINSA.
      #
      # VACIO A PROPOSITO, y esto NO es un olvido. El texto del MINSA -numero, horario, alcance- lo
      # tiene que confirmar el dueno, y este repo prohibe rellenar con supuestos lo que no esta
      # confirmado. Un telefono inventado no es un placeholder inofensivo: manda a alguien que esta
      # mal a llamar a la nada. NO se completa esta linea "para probar" con un numero de ejemplo.
      #
      # Mientras siga vacio, el aviso a ADMIN/ALQUIMISTA se emite igual -un humano se entera y puede
      # actuar- y a la persona no se le muestra nada. El dia que llegue el texto confirmado se pega
      # aca (o se pone RENASIA_MENSAJE_APOYO) y empieza a mostrarse, sin desplegar codigo.
      #
      # El umbral que decide CUANDO se muestra no vive aca: son las dos constantes de
      # PatronDeMalestarRepetido (3 detecciones / 7 dias), tambien a confirmar con el dueno.
      mensaje: ${RENASIA_MENSAJE_APOYO:}
  # V90 fuera de alcance (2026-09-03): sin esto en true, GrabacionV90Controller no se crea
  # y las cuatro rutas de /v90-recordings dejan de existir. Los 23 archivos y la tabla
  # quedan intactos — el dia que vuelva, se prende la propiedad y nada hay que rehacer.
  onboarding:
    v90:
      habilitado: ${ONBOARDING_V90_HABILITADO:false}
  users:
    account-deletion:
      grace-period-days: ${ACCOUNT_DELETION_GRACE_DAYS:14}

# ---------------------------------------------------------------------------------------------
# Auditoria NFR 2026-09-06 (2a pasada). El backend vive DETRAS de CloudFront, asi que
# `request.getRemoteAddr()` -que usan los ocho puntos que limitan por IP: login, alta, reset-
# devolvia la IP del borde de CloudFront, NO la del cliente. Consecuencia: el limite de 50
# intentos de login por hora "por IP" era en realidad UN solo contador compartido por TODOS los
# usuarios del producto; seis personas equivocandose ocho veces bloqueaban el login a todo el
# mundo, y un atacante lo lograba solo. `framework` registra el ForwardedHeaderFilter de
# Spring, que reescribe la direccion remota con el primer valor de X-Forwarded-For.
#
# >>> POR CONFIRMAR (auditoria 2026-09-18, OUT-1). Aca decia que ese primer valor es "el que
# >>> CloudFront pone: el cliente real". Eso solo es cierto si CloudFront REEMPLAZA la cabecera.
# >>> Si la AÑADE —que es su comportamiento documentado— y el cliente manda su propio
# >>> X-Forwarded-For, lo que llega es "<lo que mando el cliente>, <IP real>" y
# >>> ForwardedHeaderUtils toma el valor MAS A LA IZQUIERDA, o sea el del cliente. En ese caso
# >>> cualquier anonimo elige su propia IP y los OCHO limites por IP (login, alta, reset) no
# >>> cuentan nada: fuerza bruta ilimitada, ademas de envenenar solicitudes_cuenta.ip_solicitud.
# >>>
# >>> El security group NO cubre esto: protege contra saltarse CloudFront, no contra mandar la
# >>> cabecera A TRAVES de CloudFront.
# >>>
# >>> Se resuelve con UNA peticion contra el despliegue, que tiene que correr el dueno:
# >>>   curl -H 'X-Forwarded-For: 203.0.113.9' https://<dominio>/api/v1/auth/login ...
# >>> y mirar que IP registro el backend. Si vio 203.0.113.9, hay que tomar la IP contando
# >>> desde la DERECHA (con CloudFront delante, el ultimo valor es el que agrega el borde y el
# >>> cliente no puede escribir despues de el). El cambio va en DireccionIpDelCliente, que
# >>> existe justamente para tener un solo lugar donde tocarlo (E-151).
# ---------------------------------------------------------------------------------------------
# Spring AI registra "Aggregation Error" con la pila entera CADA vez que un stream del
# modelo termina en error — y lo hace CUATRO veces por peticion, una por cada operador
# suyo que la ve pasar. Un solo 503 de Google llenaba el log con ~600 lineas.
#
# No se pierde nada callandolo: `ConversacionRenasiaService.logFalloDeStreaming` ya
# registra el mismo fallo, una vez, y ademas sabe distinguir lo transitorio de un defecto
# real. Este logger no aporta una segunda opinion, aporta el mismo hecho cuatro veces.
logging:
  level:
    org.springframework.ai.chat.model.MessageAggregator: "OFF"

server:
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:framework}

# Actuator: lo que hoy ya pasa, pero dicho a proposito en vez de heredado.
#
# Ninguna de estas cuatro claves existia, y las cuatro coinciden con el default de Boot 4.1.1
# —o sea que escribirlas NO cambia el comportamiento—. Se escriben por lo que evitan: al declarar
# `SecurityConfig` una cadena propia acotada a `/api/v1/**`, Spring Boot retira
# `ManagementWebSecurityAutoConfiguration`, que es la que normalmente deja `/actuator/health`
# publico y exige autenticacion para TODO el resto de actuator. Ese respaldo ya no esta.
#
# Con el respaldo retirado, lo unico que mantiene cerrados `/actuator/env`, `/configprops`,
# `/heapdump` y `/loggers` es el default de exposicion. Y ese default lo puede ensanchar una sola
# entrada en Parameter Store —`application-prod.yaml` importa `/renaser/prod/` con binding
# relajado— sin tocar el repo ni pasar por revision. `/heapdump` entrega memoria cruda, que con
# `spring.session.timeout: 30d` incluye ids de sesion vivos.
#
# Escrito aca, ensanchar la superficie de administracion vuelve a exigir un cambio versionado.
# (Auditoria de seguridad 2026-09-18, OUT-2.)
management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health
  endpoint:
    health:
      access: read-only
      show-details: never
