spring:
  # D-237: la MISMA configuracion de actuator y metricas que main (no una copia), para que
  # `PuertoDeAdministracionIT` pruebe lo que corre en produccion.
  config:
    import: classpath:actuator.yaml
  # C-14 (docs/informes/auditoria-seguridad-concurrencia-2026-09-01.html): espeja el bloque
  # de main -- sin esto, TODA la suite corria con hilos de plataforma (el default de Tomcat/
  # el pool de @Async) mientras produccion corre con hilos virtuales, asi que las pruebas no
  # ejercitaban el mismo modelo de concurrencia que el sistema real.
  threads:
    virtual:
      enabled: true
  # Espeja el bloque de main. Sin esto la suite entera no arranca: este archivo REEMPLAZA a
  # src/main/resources/application.yaml (mismo nombre, gana el de test), asi que la clave de
  # main no llega aca, y `ParameterStoreAutoConfiguration` es @ConditionalOnProperty con
  # matchIfMissing=true -- con la propiedad ausente se activa, crea un bean `SsmClient` y falla
  # al resolver la region porque no hay credenciales de AWS en CI ni en local. Mismo motivo por
  # el que ya estan espejados los hilos virtuales (C-14) y open-in-view (C-18).
  cloud:
    aws:
      parameterstore:
        enabled: false
      region:
        static: us-east-1
  # Mismo motivo que arriba: en main este limite (fijado al resolver C-1) acota a cuantos
  # @Async concurrentes se despachan a la vez (hoy solo onboarding, la validacion V90). Sin
  # espejarlo, un test que dispare varias validaciones a la vez veria un comportamiento de
  # throttling distinto al de produccion.
  # Corregido 2026-09-27 (E-360): hasta esta fecha no acotaba nada (Spring Boot no armaba su
  # ejecutor por el broker STOMP); ahora acota el ejecutor de IA de EjecucionAsincronaConfig.
  task:
    execution:
      simple:
        concurrency-limit: 20
  # D-212: espeja el tope del multipart de main (la foto propia de un grupo). Sin esto las pruebas
  # correrian con el 1 MB por defecto de Spring y no probarian el limite que tiene produccion.
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  # Espeja el bloque de main: sin esto, Spring Session no registra su repositorio Redis y
  # GestionSesionesService (que inyecta FindByIndexNameSessionRepository para cerrar todas
  # las sesiones de un usuario) rompe el contexto de TODO test @SpringBootTest. El contenedor
  # Redis ya lo levanta TestcontainersConfiguration, asi que apunta a uno real (E-40).
  session:
    timeout: 30d
    data:
      redis:
        repository-type: indexed
        namespace: renaser:test:session:v2
  ai:
    model:
      chat: none
      embedding: none
      vectorstore: none
  # C-18 (docs/informes/auditoria-fixes/C-18.md): espeja el bloque de main -- sin esto, los
  # tests seguirian ejercitando open-in-view=true (el default de Boot) mientras produccion
  # corre con false, y un futuro @OneToMany/@ManyToOne perezoso que rompiera un DTO armado
  # fuera del servicio recien se notaria en produccion, no en la suite. Mismo criterio que
  # el espejo de hilos virtuales de C-14, arriba.
  jpa:
    open-in-view: false
    # Espejo de V-6 (D-180) en src/main/resources/application.yaml: los IT tienen que cargar
    # las colecciones igual que produccion.
    properties:
      hibernate:
        default_batch_fetch_size: 50
  autoconfigure:
    exclude:
      # Sin credenciales de Gemini/Vertex en este entorno de test — los tests no llaman
      # IA de verdad (rag usa adaptadores NoOp). El selector spring.ai.model.* no alcanzo
      # a desactivar el autoconfig de conexion de embeddings, asi que se excluye la clase
      # de punta a punta (E-15 en la bitacora).
      - org.springframework.ai.model.google.genai.autoconfigure.chat.GoogleGenAiChatAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingConnectionAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiTextEmbeddingAutoConfiguration
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration

# Este archivo REEMPLAZA a src/main/resources/application.yaml en el classpath de test
# (mismo nombre: gana el de test), NO lo complementa — toda propiedad que un bean resuelva
# con @Value tiene que estar TAMBIEN aca o el contexto no levanta. Va al final, fuera del
# bloque `spring:`, para no partirlo por accidente.
renaser:
  # D-224: el barrido que completa los chats de los aprendices NO corre solo en la suite: dispararia
  # en medio de otra prueba y le crearia chats a sus datos. Las pruebas lo llaman directo.
  scheduling:
    chats-de-aprendices:
      activo: false
  # E-360: espeja el default de main (application.yaml): cuantos listeners de eventos corren a la vez.
  eventos:
    concurrencia: 4
  web:
    cors:
      origenes: http://localhost:8081
    # Placeholder de test: ningun test manda un mail real (EnviarEmailPort es NoOp).
    reset-password-url: http://localhost:8081/reset-password
    activate-account-url: http://localhost:8081/activate-account
  auth:
    # Vacios a proposito, igual que en main: los adaptadores OAuth fallan explicito al
    # INVOCARSE sin configurar, no al arrancar. Tienen que existir como propiedades igual,
    # porque los @Value de sus constructores se resuelven al crear el bean (E-40).
    apple:
      auth-key-path:
      key-id:
      team-id:
      client-id:
    facebook:
      app-id:
      app-secret:
    google:
      client-id:
      client-secret:
  renasia:
    limite-diario: 25
    apoyo:
      # Vacio, igual que en main y por el mismo motivo: el texto del MINSA no esta confirmado y no
      # se inventa. Los tests que necesitan un texto configurado construyen su propio MensajeDeApoyo,
      # no dependen de esta linea. Que este presente documenta que existe la propiedad.
      mensaje:
